<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelime 1.0</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0F1123;
      --card-bg: #1E2246;
      --panel: #181A32;
      --accent: #FF6B00;
      --fuchsia: #FF007F;
      --text: #FFFFFF;
      --muted: #64748B;
      --success: #10B981;
      --danger: #EF4444;
      --gold: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-bottom: 1px solid #242852;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-container { display: flex; align-items: baseline; gap: 6px; }
    .logo-text { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
    .version-tag { font-size: 10px; font-weight: 700; color: var(--muted); }
    .streak-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      background: var(--panel);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #2A2E5D;
    }

    /* MOD ANAHTARI (Kelimeler vs Kalıplar) */
    .mode-switch {
      display: flex;
      background: #101226;
      padding: 3px;
      border-radius: 12px;
      border: 1px solid #242852;
    }
    .mode-btn {
      flex: 1;
      padding: 7px;
      font-size: 12px;
      font-weight: 800;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(255,107,0,0.3);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: var(--panel);
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #242852;
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .tab-content { display: none; height: 100%; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* FLASHCARD */
    .filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
    .pill {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid #242852;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pill.fav-pill.active { background: var(--gold); color: #0F1123; border-color: var(--gold); }

    .card-container {
      perspective: 1000px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
    }
    .card {
      width: 100%;
      max-width: 400px;
      height: 310px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: var(--card-bg);
      border: 2px solid var(--fuchsia);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 22px;
      text-align: center;
      backface-visibility: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card-back { transform: rotateY(180deg); }
    .badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      position: absolute;
      top: 16px;
      left: 18px;
    }
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
    }
    .fav-btn.active { color: var(--gold); }
    
    .word-text { font-size: 28px; font-weight: 800; margin-bottom: 14px; word-break: break-word; }
    .sentence-box {
      background: #12152E;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #CBD5E1;
      font-style: italic;
      margin-top: 10px;
      border: 1px solid #242852;
      max-height: 95px;
      overflow-y: auto;
    }
    .audio-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 7px 14px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .card-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }
    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--muted); color: #fff; }

    /* KÜTÜPHANE */
    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid #2A2E5D;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .word-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .word-item {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TEST */
    .quiz-lvl-btn {
      background: var(--panel);
      color: var(--muted);
      border: 2px solid #2A2E5D;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.2s;
    }
    .quiz-lvl-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .option-btn {
      width: 100%;
      padding: 15px;
      margin: 6px 0;
      background: var(--panel);
      border: 1px solid #2A2E5D;
      color: #fff;
      border-radius: 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .option-btn.selected { background: var(--accent); border-color: #fff; }
    .result-row {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div class="logo-container">
        <span class="logo-text">KELİME 1.0</span>
        <span class="version-tag">v2.0</span>
      </div>
      <div class="streak-badge" id="streak-indicator">🔥 0 Gün</div>
    </div>
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-mode-kelime" onclick="setAppMode('kelime')">📚 Kelimeler</button>
      <button class="mode-btn" id="btn-mode-kalip" onclick="setAppMode('kalip')">💬 Kalıplar & Deyimler</button>
    </div>
  </header>

  <main>
    <!-- 1. KARTLAR -->
    <section id="tab-cards" class="tab-content active">
      <div class="filter-pills" id="level-pills"></div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted)">
        <span id="card-level-tag">SEVİYE: A1</span>
        <span id="card-counter">0 / 0</span>
      </div>
      <div class="card-container">
        <div class="card" id="flashcard" onclick="flipCard()">
          <div class="card-face card-front">
            <span class="badge" id="front-badge">A1</span>
            <button class="fav-btn" id="fav-btn-front" onclick="toggleFavorite(event)">☆</button>
            <div class="word-text" id="front-word">Yükleniyor...</div>
            <button class="audio-btn" onclick="speakCurrent(event)">🔊 Dinle</button>
          </div>
          <div class="card-face card-back">
            <span class="badge" id="back-badge">A1</span>
            <button class="fav-btn" id="fav-btn-back" onclick="toggleFavorite(event)">☆</button>
            <div class="word-text" style="color:var(--accent)" id="back-word">...</div>
            <div class="sentence-box" id="back-sentence">...</div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="btn btn-secondary" onclick="prevCard()">◀ Önceki</button>
        <button class="btn btn-primary" onclick="nextCard()">Sonraki ▶</button>
      </div>
    </section>

    <!-- 2. KÜTÜPHANE -->
    <section id="tab-library" class="tab-content">
      <input type="text" class="search-box" id="search-input" placeholder="Ara..." oninput="renderLibrary()">
      <div class="word-list" id="library-list"></div>
    </section>

    <!-- 3. TEST MODU -->
    <section id="tab-quiz" class="tab-content">
      <div id="quiz-setup">
        <h2 style="color:var(--accent); margin-bottom:10px;" id="quiz-title">🎯 Test Ayarları</h2>
        <p style="color:var(--muted); font-size:13px; margin-bottom:16px;">Soru havuzuna dahil edilecek filtreleri ve soru adedini seç:</p>
        
        <label style="font-size:13px; font-weight:700; margin-bottom:8px; display:block;" id="quiz-filter-label">Dahil Edilecek Seviyeler:</label>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px;" id="quiz-levels-container"></div>

        <label style="font-size:13px; font-weight:700; margin-bottom:8px; display:block;">Soru Sayısı:</label>
        <select id="quiz-count" class="search-box" style="margin-bottom:20px;">
          <option value="5">5 Soru</option>
          <option value="10" selected>10 Soru</option>
          <option value="15">15 Soru</option>
          <option value="20">20 Soru</option>
        </select>

        <p id="quiz-error-msg" style="color:var(--danger); font-size:13px; font-weight:700; margin-bottom:10px; display:none;"></p>
        <button class="btn btn-primary" style="width:100%;" onclick="startQuiz()">🚀 Testi Başlat</button>
      </div>

      <div id="quiz-active" style="display:none; flex-direction:column; height:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span id="quiz-progress" style="color:var(--accent); font-weight:700;">Soru 1 / 10</span>
          <button onclick="finishQuiz()" style="background:var(--danger); border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700;">Bitir</button>
        </div>
        <div style="background:var(--card-bg); padding:16px; border-radius:16px; border:2px solid var(--fuchsia); text-align:center; margin-bottom:12px;">
          <span id="quiz-badge" style="color:var(--fuchsia); font-weight:800; font-size:11px; display:block; margin-bottom:4px;">KATEGORİ</span>
          <div id="quiz-word" style="font-size:24px; font-weight:800;">Word</div>
          <button class="audio-btn" style="margin-top:8px;" onclick="speakQuiz()">🔊 Dinle</button>
        </div>
        <div id="quiz-options" style="flex:1;"></div>

        <div style="display:flex; gap:10px; margin-top:8px;">
          <button id="quiz-prev-btn" class="btn btn-secondary" onclick="prevQuizQuestion()">◀ Önceki Soru</button>
          <button id="quiz-next-btn" class="btn btn-primary" onclick="nextQuizQuestion()">Sonraki Soru ▶</button>
        </div>
      </div>

      <div id="quiz-result" style="display:none; flex-direction:column; height:100%;">
        <h2 style="color:var(--accent); text-align:center; margin-bottom:10px;">🏆 Test Tamamlandı</h2>
        <div id="quiz-stats" style="text-align:center; font-size:14px; margin-bottom:14px;"></div>
        <div id="quiz-review" style="flex:1; overflow-y:auto;"></div>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="resetQuiz()">Yeni Test</button>
      </div>
    </section>

    <!-- 4. EKLE -->
    <section id="tab-add" class="tab-content">
      <h2 style="color:var(--accent); margin-bottom:12px;" id="add-title">Yeni Kelime Ekle</h2>
      <input type="text" id="add-en" class="search-box" placeholder="İngilizce İfade">
      <input type="text" id="add-tr" class="search-box" placeholder="Türkçe Anlamı">
      <input type="text" id="add-sentence" class="search-box" placeholder="Örnek Cümle">
      <select id="add-level" class="search-box"></select>
      <button class="btn btn-primary" style="width:100%; margin-top:8px;" onclick="saveNewEntry()">Kaydet</button>
      <p id="add-status" style="margin-top:10px; font-size:14px; text-align:center;"></p>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('cards', this)">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4m2 2v12h12V6H6z"/></svg>
      Kartlar
    </button>
    <button class="nav-btn" onclick="switchTab('library', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6m16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2m0 14H8V4h12v12z"/></svg>
      Kütüphane
    </button>
    <button class="nav-btn" onclick="switchTab('quiz', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
      Test
    </button>
    <button class="nav-btn" onclick="switchTab('add', this)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Ekle
    </button>
  </nav>

  <script>
    let appMode = localStorage.getItem('kelime_aktif_mod') || 'kelime'; // 'kelime' veya 'kalip'
    let dataSets = {
      kelime: [],
      kalip: []
    };
    let currentCards = [];
    let currentCardIndex = 0;
    let currentFilter = 'Tümü';

    const CATEGORIES = {
      kelime: ['A1', 'A2', 'B1', 'B2', 'C1'],
      kalip: ['Deyim', 'Phrasal', 'Günlük']
    };

    function getStorageKey(sub) {
      return `app_${appMode}_${sub}`;
    }

    /* GÜNLÜK SERİ (STREAK) */
    function checkAndUpdateStreak() {
      const today = new Date().toISOString().slice(0, 10);
      let data = JSON.parse(localStorage.getItem('kelime_streak') || '{"lastDate":"","count":0}');

      if (data.lastDate === today) {
        renderStreak(data.count);
        return;
      }

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      if (data.lastDate === yesterdayStr) {
        data.count += 1;
      } else {
        data.count = 1;
      }

      data.lastDate = today;
      localStorage.setItem('kelime_streak', JSON.stringify(data));
      renderStreak(data.count);
    }

    function renderStreak(count) {
      const el = document.getElementById('streak-indicator');
      if (el) el.innerText = `🔥 ${count} Gün`;
    }

    /* MOD GEÇİŞİ */
    function setAppMode(mode) {
      saveCardProgress();
      appMode = mode;
      localStorage.setItem('kelime_aktif_mod', mode);

      document.getElementById('btn-mode-kelime').classList.toggle('active', mode === 'kelime');
      document.getElementById('btn-mode-kalip').classList.toggle('active', mode === 'kalip');

      document.getElementById('search-input').placeholder = mode === 'kelime' ? "Kelime ara..." : "Kalıp veya deyim ara...";
      document.getElementById('add-title').innerText = mode === 'kelime' ? "Yeni Kelime Ekle" : "Yeni Kalıp / Deyim Ekle";

      buildPillsAndControls();
      loadModeState();
      renderLibrary();
      checkAndUpdateStreak();
    }

    function buildPillsAndControls() {
      // 1. Kart Filtreleri
      const pillBox = document.getElementById('level-pills');
      pillBox.innerHTML = '';
      const items = ['Tümü', 'Favoriler', ...CATEGORIES[appMode]];

      items.forEach(it => {
        const d = document.createElement('div');
        d.className = 'pill' + (it === 'Favoriler' ? ' fav-pill' : '');
        d.innerText = it === 'Favoriler' ? '⭐ Favoriler' : it;
        d.onclick = () => filterCards(it, d);
        pillBox.appendChild(d);
      });

      // 2. Test Modu Butonları
      const quizLvlBox = document.getElementById('quiz-levels-container');
      quizLvlBox.innerHTML = '';
      CATEGORIES[appMode].forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'quiz-lvl-btn active';
        btn.dataset.lvl = cat;
        btn.innerText = cat;
        btn.onclick = () => btn.classList.toggle('active');
        quizLvlBox.appendChild(btn);
      });

      // 3. Ekleme Açılır Menüsü
      const addSelect = document.getElementById('add-level');
      addSelect.innerHTML = '';
      CATEGORIES[appMode].forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.innerText = cat;
        addSelect.appendChild(opt);
      });
    }

    /* VERİ YÜKLEME */
    Promise.all([
      fetch('kelimeler.json').then(r => r.json()).catch(() => []),
      fetch('kaliplar.json').then(r => r.json()).catch(() => [])
    ]).then(([kelimeler, kaliplar]) => {
      const customK = JSON.parse(localStorage.getItem('custom_words') || '[]');
      const customP = JSON.parse(localStorage.getItem('custom_phrases') || '[]');

      dataSets.kelime = [...customK, ...kelimeler];
      dataSets.kalip = [...customP, ...kaliplar];

      checkAndUpdateStreak();
      setAppMode(appMode);
    });

    function getActiveDataset() {
      return dataSets[appMode] || [];
    }

    function getFavorites() {
      return JSON.parse(localStorage.getItem(getStorageKey('favs')) || '[]');
    }

    function isFavorite(word) {
      return getFavorites().includes((word || '').trim().toLowerCase());
    }

    function toggleFavorite(e) {
      if (e) e.stopPropagation();
      if (!currentCards.length) return;
      const word = (currentCards[currentCardIndex].ingilizce || '').trim().toLowerCase();
      let favs = getFavorites();
      const idx = favs.indexOf(word);

      if (idx === -1) favs.push(word);
      else favs.splice(idx, 1);

      localStorage.setItem(getStorageKey('favs'), JSON.stringify(favs));
      updateFavButtons();

      if (currentFilter === 'Favoriler') {
        currentCards = getActiveDataset().filter(w => isFavorite(w.ingilizce));
        if (currentCardIndex >= currentCards.length) currentCardIndex = Math.max(0, currentCards.length - 1);
        updateCardUI();
      }
      checkAndUpdateStreak();
    }

    function updateFavButtons() {
      if (!currentCards.length) return;
      const word = (currentCards[currentCardIndex].ingilizce || '').trim().toLowerCase();
      const fav = isFavorite(word);
      ['fav-btn-front', 'fav-btn-back'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.innerText = fav ? '★' : '☆';
          btn.className = 'fav-btn' + (fav ? ' active' : '');
        }
      });
    }

    function saveCardProgress() {
      if (!currentCards.length) return;
      const cur = currentCards[currentCardIndex];
      if (!cur) return;

      const progress = JSON.parse(localStorage.getItem(getStorageKey('progress')) || '{}');
      progress[currentFilter] = {
        word: (cur.ingilizce || '').trim().toLowerCase(),
        index: currentCardIndex
      };

      localStorage.setItem(getStorageKey('progress'), JSON.stringify(progress));
      localStorage.setItem(getStorageKey('last_filter'), currentFilter);
    }

    function loadModeState() {
      const lastF = localStorage.getItem(getStorageKey('last_filter')) || 'Tümü';
      currentFilter = lastF;

      document.querySelectorAll('#level-pills .pill').forEach(p => {
        const txt = p.innerText.replace('⭐ ', '').trim();
        p.classList.toggle('active', txt === lastF);
      });

      loadCardsForFilter(lastF);
    }

    function loadCardsForFilter(filter) {
      const pool = getActiveDataset();

      if (filter === 'Favoriler') {
        currentCards = pool.filter(w => isFavorite(w.ingilizce));
      } else if (filter === 'Tümü') {
        currentCards = pool;
      } else {
        currentCards = pool.filter(w => (w.seviye || '').toUpperCase() === filter.toUpperCase());
      }

      if (!currentCards.length) {
        currentCardIndex = 0;
        updateCardUI();
        return;
      }

      const progress = JSON.parse(localStorage.getItem(getStorageKey('progress')) || '{}');
      const itemProg = progress[filter];
      let targetWord = '';
      let targetIdx = -1;

      if (itemProg && typeof itemProg === 'object') {
        targetWord = (itemProg.word || '').trim().toLowerCase();
        targetIdx = itemProg.index;
      }

      let found = -1;
      if (targetWord) {
        found = currentCards.findIndex(w => (w.ingilizce || '').trim().toLowerCase() === targetWord);
      }
      if (found === -1 && targetIdx >= 0 && targetIdx < currentCards.length) {
        found = targetIdx;
      }

      currentCardIndex = (found !== -1) ? found : 0;
      updateCardUI();
    }

    function filterCards(filter, el) {
      saveCardProgress();
      document.querySelectorAll('#level-pills .pill').forEach(p => p.classList.remove('active'));
      if (el) el.classList.add('active');
      currentFilter = filter;
      loadCardsForFilter(filter);
      saveCardProgress();
      checkAndUpdateStreak();
    }

    function updateCardUI() {
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');

      if (!currentCards.length) {
        document.getElementById('front-word').innerText = "Kayıt Yok";
        document.getElementById('back-word').innerText = currentFilter === 'Favoriler' ? "Yıldızlı ifadeniz bulunmuyor!" : "Bu kategoride kayıt bulunamadı.";
        document.getElementById('back-sentence').innerText = "Kartlardaki yıldız (☆) simgesine dokunarak favorilerine ekleyebilirsin.";
        document.getElementById('card-level-tag').innerText = "BOŞ";
        document.getElementById('card-counter').innerText = "0 / 0";
        ['fav-btn-front', 'fav-btn-back'].forEach(id => {
          const b = document.getElementById(id);
          if (b) b.innerText = "☆";
        });
        return;
      }

      const w = currentCards[currentCardIndex];
      document.getElementById('front-word').innerText = w.ingilizce;
      document.getElementById('back-word').innerText = w.turkce;
      document.getElementById('back-sentence').innerText = `"${w.cumle}"`;
      document.getElementById('front-badge').innerText = w.seviye || '';
      document.getElementById('back-badge').innerText = w.seviye || '';
      document.getElementById('card-level-tag').innerText = `KATEGORİ: ${w.seviye || ''}`;
      document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${currentCards.length}`;
      updateFavButtons();
    }

    function flipCard() {
      if (currentCards.length) {
        document.getElementById('flashcard').classList.toggle('flipped');
        checkAndUpdateStreak();
      }
    }

    function nextCard() {
      if (currentCards.length) {
        currentCardIndex = (currentCardIndex + 1) % currentCards.length;
        updateCardUI();
        saveCardProgress();
        checkAndUpdateStreak();
      }
    }

    function prevCard() {
      if (currentCards.length) {
        currentCardIndex = (currentCardIndex - 1 + currentCards.length) % currentCards.length;
        updateCardUI();
        saveCardProgress();
        checkAndUpdateStreak();
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        window.speechSynthesis.speak(u);
      }
    }

    function speakCurrent(e) {
      e.stopPropagation();
      if (currentCards.length) {
        speakText(currentCards[currentCardIndex].ingilizce);
        checkAndUpdateStreak();
      }
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (btn) btn.classList.add('active');
      if (tab === 'library') renderLibrary();
    }

    function renderLibrary() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const list = document.getElementById('library-list');
      list.innerHTML = '';
      const pool = getActiveDataset();
      const filtered = pool.filter(w => (w.ingilizce || '').toLowerCase().includes(q) || (w.turkce || '').toLowerCase().includes(q)).slice(0, 60);

      filtered.forEach(w => {
        const isFav = isFavorite(w.ingilizce);
        const item = document.createElement('div');
        item.className = 'word-item';
        item.innerHTML = `
          <div>
            <span style="color:${isFav ? 'var(--gold)' : 'var(--accent)'}; font-weight:800; font-size:11px; margin-right:6px;">${isFav ? '★ ' : ''}${w.seviye}</span>
            <strong>${w.ingilizce}</strong>
            <div style="font-size:12px; color:var(--muted); margin-top:2px;">${w.turkce}</div>
          </div>
          <button class="audio-btn" onclick="speakText('${w.ingilizce}')">🔊</button>
        `;
        list.appendChild(item);
      });
    }

    /* TEST SİSTEMİ */
    let quizQuestions = [];
    let quizIndex = 0;

    function startQuiz() {
      const err = document.getElementById('quiz-error-msg');
      err.style.display = 'none';

      const activeLevels = Array.from(document.querySelectorAll('#quiz-levels-container .quiz-lvl-btn.active')).map(b => b.dataset.lvl.toUpperCase());
      if (activeLevels.length === 0) {
        err.innerText = "⚠️ Lütfen en az bir kategori/seviye seçin!";
        err.style.display = 'block';
        return;
      }

      const pool = getActiveDataset().filter(w => activeLevels.includes((w.seviye || '').toUpperCase()));
      if (pool.length < 4) {
        err.innerText = `⚠️ Seçilen kategorilerde test için yeterli soru yok (Mevcut: ${pool.length})`;
        err.style.display = 'block';
        return;
      }

      const count = parseInt(document.getElementById('quiz-count').value);
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, Math.min(count, pool.length));

      const allItems = getActiveDataset();
      quizQuestions = selected.map(w => {
        const distractors = allItems.filter(k => k.turkce !== w.turkce).sort(() => 0.5 - Math.random()).slice(0, 3).map(k => k.turkce);
        const options = [...distractors, w.turkce].sort(() => 0.5 - Math.random());
        return { word: w, correct: w.turkce, options, chosen: null };
      });

      quizIndex = 0;
      document.getElementById('quiz-setup').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('quiz-active').style.display = 'flex';
      renderQuizQuestion();
      checkAndUpdateStreak();
    }

    function renderQuizQuestion() {
      const q = quizQuestions[quizIndex];
      document.getElementById('quiz-progress').innerText = `Soru ${quizIndex + 1} / ${quizQuestions.length}`;
      document.getElementById('quiz-badge').innerText = `KATEGORİ: ${q.word.seviye || ''}`;
      document.getElementById('quiz-word').innerText = q.word.ingilizce;
      const opts = document.getElementById('quiz-options');
      opts.innerHTML = '';

      q.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'option-btn' + (q.chosen === opt ? ' selected' : '');
        b.innerText = opt;
        b.onclick = () => { q.chosen = opt; renderQuizQuestion(); };
        opts.appendChild(b);
      });

      const prevBtn = document.getElementById('quiz-prev-btn');
      if (quizIndex === 0) {
        prevBtn.disabled = true;
        prevBtn.style.opacity = '0.4';
        prevBtn.style.pointerEvents = 'none';
      } else {
        prevBtn.disabled = false;
        prevBtn.style.opacity = '1';
        prevBtn.style.pointerEvents = 'auto';
      }

      const nextBtn = document.getElementById('quiz-next-btn');
      nextBtn.innerText = (quizIndex === quizQuestions.length - 1) ? 'Sonuçları Gör 🏁' : 'Sonraki Soru ▶';
    }

    function speakQuiz() {
      speakText(quizQuestions[quizIndex].word.ingilizce);
    }

    function prevQuizQuestion() {
      if (quizIndex > 0) {
        quizIndex--;
        renderQuizQuestion();
      }
    }

    function nextQuizQuestion() {
      if (quizIndex < quizQuestions.length - 1) {
        quizIndex++;
        renderQuizQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-active').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'flex';

      const correctCount = quizQuestions.filter(q => q.chosen === q.correct).length;
      document.getElementById('quiz-stats').innerText = `Toplam ${quizQuestions.length} Soru | Doğru: ${correctCount} | Başarı: %${Math.round((correctCount/quizQuestions.length)*100)}`;

      const rev = document.getElementById('quiz-review');
      rev.innerHTML = '';
      quizQuestions.forEach(q => {
        const isOk = q.chosen === q.correct;
        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <div>
            <strong>${q.word.ingilizce}</strong>
            <div style="font-size:11px; color:var(--muted)">Cevabın: ${q.chosen || 'Boş'} | Doğru: ${q.correct}</div>
          </div>
          <span style="font-weight:800; color:${isOk ? 'var(--success)' : 'var(--danger)'}">${isOk ? 'DOĞRU' : 'YANLIŞ'}</span>
        `;
        rev.appendChild(row);
      });
    }

    function resetQuiz() {
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('quiz-setup').style.display = 'block';
    }

    function saveNewEntry() {
      const en = document.getElementById('add-en').value.trim();
      const tr = document.getElementById('add-tr').value.trim();
      const s = document.getElementById('add-sentence').value.trim() || `Example sentence for ${en}.`;
      const lvl = document.getElementById('add-level').value;

      if (!en || !tr) return;

      const newEntry = { ingilizce: en.toLowerCase(), turkce: tr.toLowerCase(), cumle: s, seviye: lvl };
      const storageKey = appMode === 'kelime' ? 'custom_words' : 'custom_phrases';
      const local = JSON.parse(localStorage.getItem(storageKey) || '[]');
      local.unshift(newEntry);
      localStorage.setItem(storageKey, JSON.stringify(local));

      dataSets[appMode].unshift(newEntry);

      document.getElementById('add-en').value = '';
      document.getElementById('add-tr').value = '';
      document.getElementById('add-sentence').value = '';
      document.getElementById('add-status').innerText = `✅ "${en}" başarıyla kaydedildi!`;
      setTimeout(() => document.getElementById('add-status').innerText = '', 3000);
      checkAndUpdateStreak();
    }
  </script>
</body>
</html>

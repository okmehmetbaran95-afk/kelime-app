<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kelime 1.0</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #0F1123;
      --card-bg: #1E2246;
      --panel: #181A32;
      --accent: #FF6B00;
      --fuchsia: #FF007F;
      --text: #FFFFFF;
      --muted: #64748B;
      --success: #10B981;
      --danger: #EF4444;
      --gold: #FBBF24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #242852;
    }
    .logo-text { font-size: 19px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
    .streak-badge {
      font-size: 13px;
      font-weight: 800;
      color: var(--accent);
      background: var(--panel);
      padding: 5px 12px;
      border-radius: 14px;
      border: 1px solid #2A2E5D;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: var(--panel);
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #242852;
      padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .tab-content { display: none; height: 100%; flex-direction: column; }
    .tab-content.active { display: flex; }

    /* FLASHCARD */
    .filter-pills { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 12px; }
    .pill {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid #242852;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .pill.fav-pill.active { background: var(--gold); color: #0F1123; border-color: var(--gold); }

    .card-container {
      perspective: 1000px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
    }
    .card {
      width: 100%;
      max-width: 400px;
      height: 320px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
      cursor: pointer;
    }
    .card.flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: var(--card-bg);
      border: 2px solid var(--fuchsia);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      backface-visibility: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .card-back { transform: rotateY(180deg); }
    .badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      position: absolute;
      top: 16px;
      left: 18px;
    }
    .fav-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s;
    }
    .fav-btn:active { transform: scale(1.3); }
    .fav-btn.active { color: var(--gold); }
    
    .word-text { font-size: 32px; font-weight: 800; margin-bottom: 16px; }
    .sentence-box {
      background: #12152E;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      color: #CBD5E1;
      font-style: italic;
      margin-top: 10px;
      border: 1px solid #242852;
    }
    .audio-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .card-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--muted); color: #fff; }

    /* KÜTÜPHANE */
    .search-box {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid #2A2E5D;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    .word-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .word-item {
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* TEST */
    .quiz-lvl-btn {
      background: var(--panel);
      color: var(--muted);
      border: 2px solid #2A2E5D;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.2s;
    }
    .quiz-lvl-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .option-btn {
      width: 100%;
      padding: 16px;
      margin: 6px 0;
      background: var(--panel);
      border: 1px solid #2A2E5D;
      color: #fff;
      border-radius: 12px;
      text-align: left;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .option-btn.selected { background: var(--accent); border-color: #fff; }
    .result-row {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header>
    <span class="logo-text">KELİME 1.0</span>
    <div class="streak-badge" id="streak-indicator">🔥 0 Gün</div>
  </header>

  <main>
    <!-- 1. KARTLAR -->
    <section id="tab-cards" class="tab-content active">
      <div class="filter-pills" id="level-pills">
        <div class="pill active" onclick="filterCards('Tümü', this)">Tümü</div>
        <div class="pill fav-pill" onclick="filterCards('Favoriler', this)">⭐ Favoriler</div>
        <div class="pill" onclick="filterCards('A1', this)">A1</div>
        <div class="pill" onclick="filterCards('A2', this)">A2</div>
        <div class="pill" onclick="filterCards('B1', this)">B1</div>
        <div class="pill" onclick="filterCards('B2', this)">B2</div>
        <div class="pill" onclick="filterCards('C1', this)">C1</div>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted)">
        <span id="card-level-tag">SEVİYE: A1</span>
        <span id="card-counter">0 / 0</span>
      </div>
      <div class="card-container">
        <div class="card" id="flashcard" onclick="flipCard()">
          <div class="card-face card-front">
            <span class="badge" id="front-badge">A1</span>
            <button class="fav-btn" id="fav-btn-front" onclick="toggleFavorite(event)">☆</button>
            <div class="word-text" id="front-word">Yükleniyor...</div>
            <button class="audio-btn" onclick="speakCurrent(event)">🔊 Dinle</button>
          </div>
          <div class="card-face card-back">
            <span class="badge" id="back-badge">A1</span>
            <button class="fav-btn" id="fav-btn-back" onclick="toggleFavorite(event)">☆</button>
            <div class="word-text" style="color:var(--accent)" id="back-word">...</div>
            <div class="sentence-box" id="back-sentence">...</div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="btn btn-secondary" onclick="prevCard()">◀ Önceki</button>
        <button class="btn btn-primary" onclick="nextCard()">Sonraki ▶</button>
      </div>
    </section>

    <!-- 2. KÜTÜPHANE -->
    <section id="tab-library" class="tab-content">
      <input type="text" class="search-box" id="search-input" placeholder="Kelime ara..." oninput="renderLibrary()">
      <div class="word-list" id="library-list"></div>
    </section>

    <!-- 3. TEST MODU -->
    <section id="tab-quiz" class="tab-content">
      <div id="quiz-setup">
        <h2 style="color:var(--accent); margin-bottom:12px;">🎯 Test Ayarları</h2>
        <p style="color:var(--muted); font-size:14px; margin-bottom:20px;">Dahil etmek istediğin seviyeleri ve soru sayısını belirle:</p>
        
        <label style="font-size:14px; font-weight:700; margin-bottom:8px; display:block;">Dahil Edilecek Seviyeler:</label>
        <div style="display:flex; gap:8px; margin-bottom:20px;" id="quiz-levels-container">
          <button type="button" class="quiz-lvl-btn active" data-lvl="A1" onclick="toggleQuizLevel(this)">A1</button>
          <button type="button" class="quiz-lvl-btn active" data-lvl="A2" onclick="toggleQuizLevel(this)">A2</button>
          <button type="button" class="quiz-lvl-btn active" data-lvl="B1" onclick="toggleQuizLevel(this)">B1</button>
          <button type="button" class="quiz-lvl-btn active" data-lvl="B2" onclick="toggleQuizLevel(this)">B2</button>
          <button type="button" class="quiz-lvl-btn active" data-lvl="C1" onclick="toggleQuizLevel(this)">C1</button>
        </div>

        <label style="font-size:14px; font-weight:700; margin-bottom:8px; display:block;">Soru Sayısı:</label>
        <select id="quiz-count" class="search-box" style="margin-bottom:24px;">
          <option value="5">5 Soru</option>
          <option value="10" selected>10 Soru</option>
          <option value="20">20 Soru</option>
          <option value="30">30 Soru</option>
        </select>

        <p id="quiz-error-msg" style="color:var(--danger); font-size:13px; font-weight:700; margin-bottom:10px; display:none;"></p>
        <button class="btn btn-primary" style="width:100%;" onclick="startQuiz()">🚀 Testi Başlat</button>
      </div>

      <div id="quiz-active" style="display:none; flex-direction:column; height:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <span id="quiz-progress" style="color:var(--accent); font-weight:700;">Soru 1 / 10</span>
          <button onclick="finishQuiz()" style="background:var(--danger); border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:700;">Bitir</button>
        </div>
        <div style="background:var(--card-bg); padding:18px; border-radius:16px; border:2px solid var(--fuchsia); text-align:center; margin-bottom:12px;">
          <span id="quiz-badge" style="color:var(--fuchsia); font-weight:800; font-size:12px; display:block; margin-bottom:4px;">SEVİYE: A1</span>
          <div id="quiz-word" style="font-size:28px; font-weight:800;">Word</div>
          <button class="audio-btn" style="margin-top:8px;" onclick="speakQuiz()">🔊 Dinle</button>
        </div>
        <div id="quiz-options" style="flex:1;"></div>
        <button id="quiz-next-btn" class="btn btn-primary" onclick="nextQuizQuestion()">Sonraki Soru ▶</button>
      </div>

      <div id="quiz-result" style="display:none; flex-direction:column; height:100%;">
        <h2 style="color:var(--accent); text-align:center; margin-bottom:10px;">🏆 Test Tamamlandı</h2>
        <div id="quiz-stats" style="text-align:center; font-size:15px; margin-bottom:15px;"></div>
        <div id="quiz-review" style="flex:1; overflow-y:auto;"></div>
        <button class="btn btn-primary" style="margin-top:10px;" onclick="resetQuiz()">Yeni Test</button>
      </div>
    </section>

    <!-- 4. KELİME EKLE -->
    <section id="tab-add" class="tab-content">
      <h2 style="color:var(--accent); margin-bottom:15px;">Yeni Kelime Ekle</h2>
      <input type="text" id="add-en" class="search-box" placeholder="İngilizce Kelime">
      <input type="text" id="add-tr" class="search-box" placeholder="Türkçe Anlamı">
      <input type="text" id="add-sentence" class="search-box" placeholder="Örnek Cümle (İsteğe bağlı)">
      <select id="add-level" class="search-box">
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="B1">B1</option>
        <option value="B2">B2</option>
        <option value="C1">C1</option>
      </select>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="saveNewWord()">Kelimeyi Kaydet</button>
      <p id="add-status" style="margin-top:10px; font-size:14px; text-align:center;"></p>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('cards', this)">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4m2 2v12h12V6H6z"/></svg>
      Kartlar
    </button>
    <button class="nav-btn" onclick="switchTab('library', this)">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6m16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2m0 14H8V4h12v12z"/></svg>
      Kütüphane
    </button>
    <button class="nav-btn" onclick="switchTab('quiz', this)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
      Test
    </button>
    <button class="nav-btn" onclick="switchTab('add', this)">
      <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      Ekle
    </button>
  </nav>

  <script>
    let allWords = [];
    let currentCards = [];
    let currentCardIndex = 0;
    let currentLevel = 'Tümü';
    let levelProgress = JSON.parse(localStorage.getItem('kelime_seviye_ilerlemeleri') || '{}');
    let favorites = JSON.parse(localStorage.getItem('kelime_favoriler') || '[]');

    /* GÜNLÜK SERİ (STREAK) */
    function checkAndUpdateStreak() {
      const today = new Date().toISOString().slice(0, 10);
      let data = JSON.parse(localStorage.getItem('kelime_streak') || '{"lastDate":"","count":0}');

      if (data.lastDate === today) {
        renderStreak(data.count);
        return;
      }

      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      const yesterdayStr = yesterday.toISOString().slice(0, 10);

      if (data.lastDate === yesterdayStr) {
        data.count += 1;
      } else {
        data.count = 1;
      }

      data.lastDate = today;
      localStorage.setItem('kelime_streak', JSON.stringify(data));
      renderStreak(data.count);
    }

    function renderStreak(count) {
      const el = document.getElementById('streak-indicator');
      if (el) el.innerText = `🔥 ${count} Gün`;
    }

    /* SEVİYE BAZLI HAFIZA YÖNETİMİ */
    function saveCardProgress() {
      if (!currentCards.length) return;
      const curWord = (currentCards[currentCardIndex]?.ingilizce || '').toLowerCase();
      levelProgress[currentLevel] = curWord;
      localStorage.setItem('kelime_seviye_ilerlemeleri', JSON.stringify(levelProgress));
      localStorage.setItem('kelime_son_aktif_seviye', currentLevel);
    }

    function isFavorite(word) {
      return favorites.includes((word || '').toLowerCase());
    }

    function toggleFavorite(e) {
      if (e) e.stopPropagation();
      if (!currentCards.length) return;
      const word = (currentCards[currentCardIndex].ingilizce || '').toLowerCase();
      const idx = favorites.indexOf(word);

      if (idx === -1) {
        favorites.push(word);
      } else {
        favorites.splice(idx, 1);
      }
      localStorage.setItem('kelime_favoriler', JSON.stringify(favorites));
      updateFavButtons();

      if (currentLevel === 'Favoriler') {
        currentCards = allWords.filter(w => isFavorite(w.ingilizce));
        if (currentCardIndex >= currentCards.length) currentCardIndex = Math.max(0, currentCards.length - 1);
        updateCardUI();
      }
      checkAndUpdateStreak();
    }

    function updateFavButtons() {
      if (!currentCards.length) return;
      const word = (currentCards[currentCardIndex].ingilizce || '').toLowerCase();
      const fav = isFavorite(word);
      ['fav-btn-front', 'fav-btn-back'].forEach(id => {
        const btn = document.getElementById(id);
        if (btn) {
          btn.innerText = fav ? '★' : '☆';
          btn.className = 'fav-btn' + (fav ? ' active' : '');
        }
      });
    }

    fetch('kelimeler.json')
      .then(res => res.json())
      .then(data => {
        const local = JSON.parse(localStorage.getItem('custom_words') || '[]');
        allWords = [...local, ...data];

        checkAndUpdateStreak();

        const sonSeviye = localStorage.getItem('kelime_son_aktif_seviye') || 'Tümü';
        currentLevel = sonSeviye;

        document.querySelectorAll('.pill').forEach(p => {
          const txt = p.innerText.replace('⭐ ', '').trim();
          if (txt === sonSeviye) p.classList.add('active');
          else p.classList.remove('active');
        });

        yukleSeviyeKartlari(sonSeviye);
        renderLibrary();
      })
      .catch(() => {
        document.getElementById('front-word').innerText = "Veri bulunamadı!";
      });

    function yukleSeviyeKartlari(level) {
      if (level === 'Favoriler') {
        currentCards = allWords.filter(w => isFavorite(w.ingilizce));
      } else if (level === 'Tümü') {
        currentCards = allWords;
      } else {
        currentCards = allWords.filter(w => (w.seviye || '').toUpperCase() === level);
      }

      // Bu seviyede en son kalınan kelimeyi bul
      const hedefKelime = (levelProgress[level] || '').toLowerCase();
      if (hedefKelime) {
        const idx = currentCards.findIndex(w => (w.ingilizce || '').toLowerCase() === hedefKelime);
        currentCardIndex = (idx !== -1) ? idx : 0;
      } else {
        currentCardIndex = 0;
      }

      updateCardUI();
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (btn) btn.classList.add('active');
      if (tab === 'library') renderLibrary();
    }

    function filterCards(level, el) {
      // Önceki seviyedeki pozisyonu diske işle
      saveCardProgress();

      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      if (el) el.classList.add('active');

      currentLevel = level;
      yukleSeviyeKartlari(level);
      saveCardProgress();
      checkAndUpdateStreak();
    }

    function updateCardUI() {
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');

      if (!currentCards.length) {
        document.getElementById('front-word').innerText = "Kelime Yok";
        document.getElementById('back-word').innerText = "Favorilere henüz kelime eklemedin!";
        document.getElementById('back-sentence').innerText = "Kartlardaki yıldız (☆) simgesine dokunarak favorilerine kelime ekleyebilirsin.";
        document.getElementById('card-level-tag').innerText = "BOŞ";
        document.getElementById('card-counter').innerText = "0 / 0";
        ['fav-btn-front', 'fav-btn-back'].forEach(id => {
          const b = document.getElementById(id);
          if (b) b.innerText = "☆";
        });
        return;
      }

      const w = currentCards[currentCardIndex];
      document.getElementById('front-word').innerText = w.ingilizce;
      document.getElementById('back-word').innerText = w.turkce;
      document.getElementById('back-sentence').innerText = `"${w.cumle}"`;
      document.getElementById('front-badge').innerText = w.seviye || 'B1';
      document.getElementById('back-badge').innerText = w.seviye || 'B1';
      document.getElementById('card-level-tag').innerText = `SEVİYE: ${w.seviye || 'B1'}`;
      document.getElementById('card-counter').innerText = `${currentCardIndex + 1} / ${currentCards.length}`;
      updateFavButtons();
    }

    function flipCard() {
      if (currentCards.length) {
        document.getElementById('flashcard').classList.toggle('flipped');
        checkAndUpdateStreak();
      }
    }

    function nextCard() {
      if (currentCards.length) {
        currentCardIndex = (currentCardIndex + 1) % currentCards.length;
        updateCardUI();
        saveCardProgress();
        checkAndUpdateStreak();
      }
    }

    function prevCard() {
      if (currentCards.length) {
        currentCardIndex = (currentCardIndex - 1 + currentCards.length) % currentCards.length;
        updateCardUI();
        saveCardProgress();
        checkAndUpdateStreak();
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US';
        window.speechSynthesis.speak(u);
      }
    }

    function speakCurrent(e) {
      e.stopPropagation();
      if (currentCards.length) {
        speakText(currentCards[currentCardIndex].ingilizce);
        checkAndUpdateStreak();
      }
    }

    function renderLibrary() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const list = document.getElementById('library-list');
      list.innerHTML = '';
      const filtered = allWords.filter(w => w.ingilizce.includes(q) || w.turkce.includes(q)).slice(0, 60);

      filtered.forEach(w => {
        const isFav = isFavorite(w.ingilizce);
        const item = document.createElement('div');
        item.className = 'word-item';
        item.innerHTML = `
          <div>
            <span style="color:${isFav ? 'var(--gold)' : 'var(--accent)'}; font-weight:800; font-size:12px; margin-right:6px;">${isFav ? '★' : ''} ${w.seviye}</span>
            <strong>${w.ingilizce}</strong>
            <div style="font-size:12px; color:var(--muted);">${w.turkce}</div>
          </div>
          <button class="audio-btn" onclick="speakText('${w.ingilizce}')">🔊</button>
        `;
        list.appendChild(item);
      });
    }

    function toggleQuizLevel(btn) {
      btn.classList.toggle('active');
    }

    let quizQuestions = [];
    let quizIndex = 0;

    function startQuiz() {
      const err = document.getElementById('quiz-error-msg');
      err.style.display = 'none';

      const activeLevels = Array.from(document.querySelectorAll('.quiz-lvl-btn.active')).map(b => b.dataset.lvl);
      if (activeLevels.length === 0) {
        err.innerText = "⚠️ Lütfen en az bir seviye seçin!";
        err.style.display = 'block';
        return;
      }

      const pool = allWords.filter(w => activeLevels.includes((w.seviye || '').toUpperCase()));
      if (pool.length < 4) {
        err.innerText = `⚠️ Seçilen seviyelerde yeterli kelime yok (Mevcut: ${pool.length})`;
        err.style.display = 'block';
        return;
      }

      const count = parseInt(document.getElementById('quiz-count').value);
      const shuffled = [...pool].sort(() => 0.5 - Math.random());
      const selected = shuffled.slice(0, Math.min(count, pool.length));

      quizQuestions = selected.map(w => {
        const distractors = allWords.filter(k => k.turkce !== w.turkce).sort(() => 0.5 - Math.random()).slice(0, 3).map(k => k.turkce);
        const options = [...distractors, w.turkce].sort(() => 0.5 - Math.random());
        return { word: w, correct: w.turkce, options, chosen: null };
      });

      quizIndex = 0;
      document.getElementById('quiz-setup').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('quiz-active').style.display = 'flex';
      renderQuizQuestion();
      checkAndUpdateStreak();
    }

    function renderQuizQuestion() {
      const q = quizQuestions[quizIndex];
      document.getElementById('quiz-progress').innerText = `Soru ${quizIndex + 1} / ${quizQuestions.length}`;
      document.getElementById('quiz-badge').innerText = `SEVİYE: ${q.word.seviye || 'B1'}`;
      document.getElementById('quiz-word').innerText = q.word.ingilizce;
      const opts = document.getElementById('quiz-options');
      opts.innerHTML = '';

      q.options.forEach(opt => {
        const b = document.createElement('button');
        b.className = 'option-btn' + (q.chosen === opt ? ' selected' : '');
        b.innerText = opt;
        b.onclick = () => { q.chosen = opt; renderQuizQuestion(); };
        opts.appendChild(b);
      });

      document.getElementById('quiz-next-btn').innerText = (quizIndex === quizQuestions.length - 1) ? 'Sonuçları Gör 🏁' : 'Sonraki Soru ▶';
    }

    function speakQuiz() {
      speakText(quizQuestions[quizIndex].word.ingilizce);
    }

    function nextQuizQuestion() {
      if (quizIndex < quizQuestions.length - 1) {
        quizIndex++;
        renderQuizQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-active').style.display = 'none';
      document.getElementById('quiz-result').style.display = 'flex';

      const correctCount = quizQuestions.filter(q => q.chosen === q.correct).length;
      document.getElementById('quiz-stats').innerText = `Toplam ${quizQuestions.length} Soru | Doğru: ${correctCount} | Başarı: %${Math.round((correctCount/quizQuestions.length)*100)}`;

      const rev = document.getElementById('quiz-review');
      rev.innerHTML = '';
      quizQuestions.forEach(q => {
        const isOk = q.chosen === q.correct;
        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <div>
            <strong>${q.word.ingilizce}</strong>
            <div style="font-size:11px; color:var(--muted)">Cevabın: ${q.chosen || 'Boş'} | Doğru: ${q.correct}</div>
          </div>
          <span style="font-weight:800; color:${isOk ? 'var(--success)' : 'var(--danger)'}">${isOk ? 'DOĞRU' : 'YANLIŞ'}</span>
        `;
        rev.appendChild(row);
      });
    }

    function resetQuiz() {
      document.getElementById('quiz-result').style.display = 'none';
      document.getElementById('quiz-setup').style.display = 'block';
    }

    function saveNewWord() {
      const en = document.getElementById('add-en').value.trim();
      const tr = document.getElementById('add-tr').value.trim();
      const s = document.getElementById('add-sentence').value.trim() || `Example for ${en}.`;
      const lvl = document.getElementById('add-level').value;

      if (!en || !tr) return;

      const newW = { ingilizce: en.toLowerCase(), turkce: tr.toLowerCase(), cumle: s, seviye: lvl };
      const local = JSON.parse(localStorage.getItem('custom_words') || '[]');
      local.unshift(newW);
      localStorage.setItem('custom_words', JSON.stringify(local));
      allWords.unshift(newW);

      document.getElementById('add-en').value = '';
      document.getElementById('add-tr').value = '';
      document.getElementById('add-sentence').value = '';
      document.getElementById('add-status').innerText = `✅ "${en}" kelimesi kaydedildi!`;
      setTimeout(() => document.getElementById('add-status').innerText = '', 3000);
      checkAndUpdateStreak();
    }
  </script>
</body>
</html>
